version: '3.9'

services:
  # Primera instancia del microservicio
  libro1:
    build:
      context: .
      dockerfile: Uttt.Micro.Libro/Dockerfile
    container_name: micro_libro_1  # Nombre del contenedor
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      - sqlserver # Se asegura de que SQL Server arranque antes

  # Segunda instancia del microservicio
  libro2:
    build:
      context: .
      dockerfile: Uttt.Micro.Libro/Dockerfile
    container_name: micro_libro_2
    ports:
      - "8082:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      - sqlserver

  # Tercera instancia del microservicio
  libro3:
    build:
      context: .
      dockerfile: Uttt.Micro.Libro/Dockerfile
    container_name: micro_libro_3
    ports:
      - "8083:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      - sqlserver

  # Servicio NGINX como balanceador de carga
  nginx:
    image: nginx:latest
    container_name: nginx_balanceador
    ports:
      - "8080:80"  # NGINX escucha en este puerto
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - libro1
      - libro2
      - libro3

# Contenedor SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sqlserver_libros
    environment:
      SA_PASSWORD: "Mario1021"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
